name: Publicar Plany 0.6.170 - 12 itens
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-plany-0.6.170.yml'
      - 'tools/lote12-v170/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: plany-official-0.6.170
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'raullqueirozz9292/Plany-Distribuicao'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Conferir canal oficial e impedir substituicao
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.6.170 --repo raullqueirozz9292/Plany-Distribuicao >/dev/null 2>&1; then
            echo "0.6.170 ja existe; nunca sobrescrever"; exit 1
          fi
          test "$(gh release view --repo raullqueirozz9292/Plany-Distribuicao --json tagName -q .tagName)" = 'v0.6.169'
          mkdir -p dist
          gh release download v0.6.169 --repo raullqueirozz9292/Plany-Distribuicao --pattern 'Plany-0.6.169.rbz' --dir dist
      - name: Construir pacote com fontes SHA-pinned e conferir integridade
        run: |
          set -euo pipefail
          python3 -m py_compile tools/lote12-v170/build.py
          python3 tools/lote12-v170/build.py
          python3 - <<'PY'
          import json, hashlib, subprocess, zipfile
          from pathlib import Path
          meta=json.loads(Path('dist/manifest-0.6.170.json').read_text())
          archive=Path('dist')/meta['archive']
          assert meta['version']=='0.6.170' and meta['source_commit']=='31d3e82a83e990adc776cf79e04fc3a2f40a5887'
          assert meta['updated_files']==17
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==meta['sha256']
          with zipfile.ZipFile(archive) as package:
            assert package.testzip() is None
            assert all(name=='plany.rb' or name.startswith('plany/') for name in package.namelist())
            for name in ('plany.rb','plany/command_mode.rb','plany/front_components.rb',
                         'plany/hardware.rb','plany/hardware_mesh.rb','plany/library.rb',
                         'plany/openings.rb','plany/parameters.rb','plany/production.rb',
                         'plany/runtime.rb','plany/volume.rb'):
              subprocess.run(['ruby','-c'],input=package.read(name),stdout=subprocess.DEVNULL,check=True)
            for name in ('plany/ui/app.js','plany/ui/model.js'):
              subprocess.run(['node','--check'],input=package.read(name),stdout=subprocess.DEVNULL,check=True)
            assert package.read('plany/native/command_keys.exe').startswith(b'MZ')
            assert "extension.version = '0.6.170'" in package.read('plany.rb').decode()
            assert '<span class="version">0.6.170</span>' in package.read('plany/ui/index.html').decode()
          print("PASS 0.6.170: Ruby/JS syntax, source SHA, version, package integrity")
          PY
      - name: Criar release verificada sem alterar antigas
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.6.170 dist/Plany-0.6.170.rbz \
            --repo raullqueirozz9292/Plany-Distribuicao \
            --target main --draft \
            --title 'Plany 0.6.170 — 12 melhorias do SketchUp' \
            --notes 'Lote aprovado de 12 melhorias: Enter aplica sem fechar, tempereiro MDF, MDF individual nas caixas de gavetas, cancelamento ao trocar modulo, cabecalho e Biblioteca/Avulsos, checkboxes imediatas, Modo Comandos configuravel, gaveta avulsa, portas de correr 1–4 folhas, profundidade automatica e dobradicas de caneco. Fonte integrada: raullqueirozz9292/Plany commit 31d3e82a83e990adc776cf79e04fc3a2f40a5887 (PR #56). Testes automáticos de integridade e sintaxe aprovados; testes nativos/visuais aprofundados ficam para revisao posterior do autor. Release anterior e instalacoes preservadas.'
          python3 - <<'PY'
          import hashlib, json, subprocess, time
          from pathlib import Path
          repo='raullqueirozz9292/Plany-Distribuicao'
          sha='sha256:'+hashlib.sha256(Path('dist/Plany-0.6.170.rbz').read_bytes()).hexdigest()
          size=Path('dist/Plany-0.6.170.rbz').stat().st_size
          rid=None
          for _ in range(15):
            result=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/releases/tags/v0.6.170'],text=True))
            assets=[a for a in result['assets'] if a['name']=='Plany-0.6.170.rbz']
            if result['draft'] and len(assets)==1 and assets[0].get('size')==size and assets[0].get('digest')==sha:
              rid=result['id'];break
            time.sleep(2)
          assert rid is not None,'RBZ remote digest not confirmed; preserve draft, do not publish'
          subprocess.run(['gh','api','--method','PATCH','repos/'+repo+'/releases/'+str(rid),'-F','draft=false','-f','make_latest=true'],check=True,stdout=subprocess.DEVNULL)
          latest=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/releases/latest'],text=True))
          assert latest['tag_name']=='v0.6.170' and not latest['draft']
          official=[a for a in latest['assets'] if a['name']=='Plany-0.6.170.rbz']
          assert len(official)==1 and official[0]['digest']==sha
          print('OFFICIAL RELEASE 0.6.170:',latest['html_url'],sha)
          PY
